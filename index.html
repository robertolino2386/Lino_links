<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Links</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Segoe UI, Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f3d75, #38bdf8);
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    main {
      max-width: 1300px;
      margin: auto;
      padding: 25px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      background: #dbeafe;
      color: #0f3d75;
      font-weight: bold;
      transition: 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #0f3d75;
      color: white;
    }

    .container {
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }

    h2 {
      color: #0f3d75;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-save,
    .btn-cancel {
      width: 100%;
      margin-top: 20px;
      border: none;
      color: white;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-save {
      background: #22c55e;
    }

    .btn-save:hover {
      background: #16a34a;
    }

    .btn-cancel {
      display: none;
      background: #6b7280;
      margin-top: 10px;
    }

    .btn-cancel:hover {
      background: #4b5563;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .links-grid {
      display: grid;
      gap: 15px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }

    .link-card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
      border-left: 6px solid #facc15;
      transition: 0.2s;
    }

    .link-card:hover {
      transform: translateY(-3px);
    }

    .categoria {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #dbeafe;
      color: #0f3d75;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
      color: #0f3d75;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .descricao {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-abrir,
    .btn-planilha,
    .btn-editar,
    .btn-excluir {
      flex: 1;
      min-width: 85px;
      border: none;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-abrir {
      background: #2563eb;
    }

    .btn-planilha {
      background: #22c55e;
    }

    .btn-editar {
      background: #f59e0b;
    }

    .btn-excluir {
      background: #ef4444;
    }

    .btn-abrir:hover {
      background: #1d4ed8;
    }

    .btn-planilha:hover {
      background: #16a34a;
    }

    .btn-editar:hover {
      background: #d97706;
    }

    .btn-excluir:hover {
      background: #dc2626;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 25px;
    }

    @media(max-width:900px) {
      .container {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Central de Links</h1>
  <p>Acesse rapidamente seus sistemas favoritos</p>
</header>

<main>

  <div class="filters">
    <button class="filter-btn active" onclick="filtrar('Todos', this)">Todos</button>
    <button class="filter-btn" onclick="filtrar('Corporativo', this)">Corporativo</button>
    <button class="filter-btn" onclick="filtrar('Pessoal', this)">Pessoal</button>
    <button class="filter-btn" onclick="filtrar('Clientes', this)">Clientes</button>
  </div>

  <div class="container">

    <div class="card">
      <h2 id="tituloForm">Novo Link</h2>

      <form id="formLink">
        <input type="hidden" id="idEdicao">

        <label>Nome do Sistema</label>
        <input type="text" id="nome" required>

        <label>Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione</option>
          <option value="Corporativo">Corporativo</option>
          <option value="Pessoal">Pessoal</option>
          <option value="Clientes">Clientes</option>
        </select>

        <label>Link do Sistema</label>
        <input type="url" id="link" required placeholder="https://exemplo.com">

        <label>Descrição</label>
        <textarea id="descricao"></textarea>

        <label>Link da Planilha Google Sheets</label>
        <input type="url" id="planilha" placeholder="https://docs.google.com/spreadsheets/d/...">

        <button type="submit" class="btn-save" id="btnSalvar">Salvar Link</button>
        <button type="button" class="btn-cancel" id="btnCancelar" onclick="limparFormulario()">Cancelar Edição</button>
      </form>
    </div>

    <div>
      <div class="card search-box">
        <input
          type="text"
          id="busca"
          placeholder="Pesquisar sistema..."
          onkeyup="renderizarLinks()"
        >
      </div>

      <div id="listaLinks" class="links-grid"></div>
    </div>

  </div>

</main>

<footer>
  Desenvolvido por <strong><em>Roberto Lino</em></strong>
</footer>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuSAF6BmB_UNiEw3BQhZ9RPVqM2X7jTORjtnI2-sIEZbSUGcIjBs7RDKVD7GGVWSCK/exec";

  let links = [];
  let filtroAtual = "Todos";

  document.getElementById("formLink").addEventListener("submit", async function(e) {
    e.preventDefault();

    const idEdicao = document.getElementById("idEdicao").value;

    const item = {
      id: idEdicao || Date.now(),
      nome: document.getElementById("nome").value,
      categoria: document.getElementById("categoria").value,
      link: document.getElementById("link").value,
      descricao: document.getElementById("descricao").value,
      planilha: document.getElementById("planilha").value
    };

    if (idEdicao) {
      item.action = "edit";
    }

    await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(item)
    });

    limparFormulario();
    carregarLinks();
  });

  async function carregarLinks() {
    try {
      const resposta = await fetch(SCRIPT_URL);
      links = await resposta.json();
      renderizarLinks();
    } catch (erro) {
      document.getElementById("listaLinks").innerHTML = `
        <div class="empty">Não foi possível carregar os links.</div>
      `;
    }
  }

  function filtrar(categoria, botao) {
    filtroAtual = categoria;

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    botao.classList.add("active");
    renderizarLinks();
  }

  function editar(id) {
    const item = links.find(link => String(link.id) === String(id));

    if (!item) return;

    document.getElementById("idEdicao").value = item.id;
    document.getElementById("nome").value = item.nome || "";
    document.getElementById("categoria").value = item.categoria || "";
    document.getElementById("link").value = item.link || "";
    document.getElementById("descricao").value = item.descricao || "";
    document.getElementById("planilha").value = item.planilha || "";

    document.getElementById("tituloForm").innerText = "Editar Link";
    document.getElementById("btnSalvar").innerText = "Salvar Alterações";
    document.getElementById("btnCancelar").style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  async function excluir(id) {
    if (!confirm("Deseja excluir este link?")) return;

    await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "delete",
        id: id
      })
    });

    carregarLinks();
  }

  function limparFormulario() {
    document.getElementById("formLink").reset();
    document.getElementById("idEdicao").value = "";
    document.getElementById("tituloForm").innerText = "Novo Link";
    document.getElementById("btnSalvar").innerText = "Salvar Link";
    document.getElementById("btnCancelar").style.display = "none";
  }

  function renderizarLinks() {
    const lista = document.getElementById("listaLinks");
    const textoBusca = document.getElementById("busca").value.toLowerCase();

    const resultado = links.filter(item => {
      const categoriaOk =
        filtroAtual === "Todos" || item.categoria === filtroAtual;

      const buscaOk =
        String(item.nome || "").toLowerCase().includes(textoBusca) ||
        String(item.categoria || "").toLowerCase().includes(textoBusca) ||
        String(item.descricao || "").toLowerCase().includes(textoBusca) ||
        String(item.link || "").toLowerCase().includes(textoBusca) ||
        String(item.planilha || "").toLowerCase().includes(textoBusca);

      return categoriaOk && buscaOk;
    });

    if (resultado.length === 0) {
      lista.innerHTML = `<div class="empty">Nenhum sistema encontrado.</div>`;
      return;
    }

    lista.innerHTML = resultado.map(item => `
      <div class="link-card">
        <div class="categoria">${item.categoria || "Sem categoria"}</div>
        <div class="titulo">${item.nome || "Sem nome"}</div>
        <div class="descricao">${item.descricao || ""}</div>

        <div class="acoes">
          <a href="${item.link}" target="_blank" class="btn-abrir">Abrir</a>

          ${item.planilha ? `
            <a href="${item.planilha}" target="_blank" class="btn-planilha">Planilha</a>
          ` : ""}

          <button class="btn-editar" onclick="editar('${item.id}')">Editar</button>
          <button class="btn-excluir" onclick="excluir('${item.id}')">Excluir</button>
        </div>
      </div>
    `).join("");
  }

  carregarLinks();
</script>

</body>
</html>
